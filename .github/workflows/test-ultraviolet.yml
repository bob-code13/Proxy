name: Test Ultraviolet Docker image

on:
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/test-ultraviolet.yml
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build Ultraviolet image
        run: docker build --progress=plain -t boberts-ultraviolet:test .
